name: 'Increment Release Version'
description: 'Automatically increment version upon merging to main/master branch'
inputs:
  github_token:
    description: "Normal GitHub Token for authentication"
    required: true
  release_pat:
    description: "Personal access token for creating a release, so github actions run"
    required: true
  pr_title:
    description: "Title of the merged PR"
    required: true
  pr_url:
    description: "URL to the merged PR"
    required: true
  repository:
    description: "The repository of the merged PR"
    required: true
  trunk_branch:
    description: "Name of the trunk branch (e.g., main or master)."
    required: false
    default: "master"
  slack-github-token:
    description: "The github token to use when calling the Slack notification action"
    required: false
  slack-webhook-url:
    description: "The webhook URL to use when calling the Slack notification action"
    required: false
  slack-suffix:
    description: "Extra text appended to the Slack message, e.g. per-repo update instructions. Start it with a newline for its own line."
    required: false
    default: ""

runs:
  using: "composite"
  steps:

    - name: Decide whether this event releases
      shell: "bash"
      id: gate
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_MERGED: ${{ github.event.pull_request.merged }}
        PR_BASE: ${{ github.event.pull_request.base.ref }}
        TRUNK: ${{ inputs.trunk_branch }}
      run: |
        # Merging a stack of PRs closes every PR in it with one merge commit that sits on the trunk, so the
        # stacked PRs' closed events look like trunk merges to any ref check in the calling workflow. Only
        # the PR whose own base is the trunk releases; the collect step below names the rest of the stack.
        # Events other than pull_request pass through, since the caller chose to run this action on them.
        if [ "$EVENT_NAME" != "pull_request" ] || { [ "$PR_MERGED" = "true" ] && [ "$PR_BASE" = "$TRUNK" ]; }; then
          echo "proceed=true" >> "$GITHUB_OUTPUT"
        else
          echo "Not releasing: the PR is not a merge into $TRUNK (merged=$PR_MERGED, base=$PR_BASE)"
          echo "proceed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Collect every PR merged by this commit
      shell: "bash"
      id: merged-prs
      if: steps.gate.outputs.proceed == 'true'
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPOSITORY: ${{ inputs.repository }}
        PR_TITLE: ${{ inputs.pr_title }}
        PR_URL: ${{ inputs.pr_url }}
      run: |
        # A collapsed stack merges several PRs as one commit and only the trunk-based PR passes the gate, so
        # the release must name the stacked PRs too or they vanish from the notes.
        extras="[]"
        if [ -n "$MERGE_SHA" ]; then
          extras=$(gh api "repos/$REPOSITORY/pulls?state=closed&sort=updated&direction=desc&per_page=50" \
            --jq "[.[] | select(.merge_commit_sha == \"$MERGE_SHA\" and .number != $PR_NUMBER)] | sort_by(.number)") \
            || { echo "Could not list merged PRs; the release will name only the triggering PR"; extras="[]"; }
        fi
        # Slack gets its own rendering: a single PR keeps the message's old shape, a stack gets one
        # bulleted line per PR.
        if [ "$(echo "$extras" | jq length)" -eq 0 ]; then
          title="$PR_TITLE"
          url="$PR_URL"
          slack=" (<$PR_URL|PR>): $PR_TITLE"
        else
          echo "Also merged by $MERGE_SHA: $(echo "$extras" | jq -r '[.[].number | tostring] | join(", ")')"
          # The release body renders as "<title> (<url>)", so the last line's URL goes in the url output and
          # every earlier line carries its own. The triggering PR stays first so its [major]/[minor]/[patch]
          # prefix still picks the version bump.
          title=$(echo "$extras" | jq -r --arg t "$PR_TITLE" --arg u "$PR_URL" \
            '([ "\($t) (\($u))" ] + [ .[:-1][] | "\(.title) (\(.html_url))" ] + [ .[-1].title ]) | join("\n")')
          url=$(echo "$extras" | jq -r '.[-1].html_url')
          slack=$(echo "$extras" | jq -r --arg t "$PR_TITLE" --arg u "$PR_URL" --arg n "$PR_NUMBER" \
            '([ ":\n• <\($u)|#\($n)> \($t)" ] + [ .[] | "\n• <\(.html_url)|#\(.number)> \(.title)" ]) | join("")')
        fi
        {
          echo "title<<PR_LIST_EOF"
          echo "$title"
          echo "PR_LIST_EOF"
          echo "url=$url"
          echo "slack<<PR_LIST_EOF"
          echo "$slack"
          echo "PR_LIST_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Get latest release
      shell: "bash"
      id: get_latest
      if: steps.gate.outputs.proceed == 'true'
      run: |
        latest_tag=$(git describe --tags `git rev-list --tags --max-count=1` | sed 's/^v//')
        echo "latest_tag=$latest_tag" >> $GITHUB_ENV

    - name: Determine new version
      shell: "bash"
      id: increment
      if: steps.gate.outputs.proceed == 'true'
      run: |
        latest_tag="${{ env.latest_tag }}"
        major=$(echo $latest_tag | cut -d'.' -f1)
        minor=$(echo $latest_tag | cut -d'.' -f2)
        patch=$(echo $latest_tag | cut -d'.' -f3)

        # This avoids a bunch of issues when PR titles contain single or double quotes
        echo ${{ toJson(inputs.pr_title) }} > tmp.txt
        PR_TITLE=$(cat tmp.txt)

        if [[ "$PR_TITLE" == "[major]"* ]]; then
          major=$((major + 1))
          minor=0
          patch=0
        elif [[ "$PR_TITLE" == "[minor]"* ]]; then
          minor=$((minor + 1))
          patch=0
        else
          # Default to minor increment or patch if [patch] in title
          if [[ "$PR_TITLE" == "[patch]"* ]]; then
            patch=$((patch + 1))
          else
            minor=$((minor + 1))
            patch=0
          fi
        fi

        new_version="$major.$minor.$patch"
        echo "new_version=$new_version" >> $GITHUB_ENV

    # // TODO slack release notification

    - name: Increment pom.xml
      shell: "bash"
      if: steps.gate.outputs.proceed == 'true'
      run: |

        NEW_VERSION=${{ env.new_version }}
        TRUNK_BRANCH=${{ inputs.trunk_branch }}

        # Update and commit `pom.xml`
        if [ -f "pom.xml" ]; then
          echo "Updating pom.xml with new version: $NEW_VERSION"
          # mvn versions:set -DnewVersion="$NEW_VERSION" -DgenerateBackupPoms=false
          # This is a lot faster than the above command
          sed -i '0,/<version>[^<]*<\/version>/s//<version>'"$NEW_VERSION"'<\/version>/' pom.xml

          echo "Setting git config"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          echo "Adding pom.xml to git"
          git add pom.xml
          echo "Committing changes"
          git commit -m "Update pom.xml to $NEW_VERSION"
          echo "Pushing changes to $TRUNK_BRANCH"
          git push origin HEAD:"$TRUNK_BRANCH"
        fi

    - name: Create a Release
      uses: ncipollo/release-action@v1
      if: steps.gate.outputs.proceed == 'true'
      with:
        token: ${{ inputs.release_pat }}
        tag: ${{ env.new_version }}
        commit: ${{ inputs.trunk_branch }}
        body: ${{ steps.merged-prs.outputs.title }} (${{ steps.merged-prs.outputs.url }})

    - name: Announce release
      uses: 8398a7/action-slack@v3
      if: steps.gate.outputs.proceed == 'true'
      with:
        text: 'Releasing `${{ inputs.repository }}` `${{ env.new_version }}`${{ steps.merged-prs.outputs.slack }}${{ inputs.slack-suffix }}'
        fields: ''
        status: ${{ job.status }}
      env:
        GITHUB_TOKEN: ${{ inputs.slack-github-token }}
        SLACK_WEBHOOK_URL: ${{ inputs.slack-webhook-url }}
